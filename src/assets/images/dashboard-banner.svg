<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180" fill="none" role="img" aria-label="Banner editorial del panel de control">
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="900" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="500" y1="0" x2="900" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Base banner -->
  <rect width="900" height="180" rx="16" fill="url(#bannerBg)"/>
  <rect width="900" height="180" rx="16" fill="url(#accentGlow)"/>

  <!-- Swiss grid background lines -->
  <g stroke="#334155" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="180"/>
    <line x1="250" y1="0" x2="250" y2="180"/>
    <line x1="400" y1="0" x2="400" y2="180"/>
    <line x1="550" y1="0" x2="550" y2="180"/>
    <line x1="700" y1="0" x2="700" y2="180"/>
    <line x1="850" y1="0" x2="850" y2="180"/>
    <line x1="0" y1="45" x2="900" y2="45"/>
    <line x1="0" y1="90" x2="900" y2="90"/>
    <line x1="0" y1="135" x2="900" y2="135"/>
  </g>

  <!-- Left Editorial Content Elements -->
  <g transform="translate(45, 35)">
    <!-- Pill Badge -->
    <rect width="180" height="26" rx="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="16" cy="13" r="4" fill="#38bdf8"/>
    <text x="28" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#7dd3fc" letter-spacing="0.5">SUPABASE CLOUD LIVE</text>

    <!-- Main Title Graphics -->
    <text x="0" y="58" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Enterprise Business Intelligence</text>
    <text x="0" y="82" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Arquitectura analítica relacional PostgreSQL con orquestación reactiva NgRx</text>
  </g>

  <!-- Right Visual Graphics: Spline Waves & Metric Badges -->
  <g transform="translate(560, 20)">
    <!-- Spline area shape -->
    <path d="M0 130 C 60 110, 110 50, 170 70 C 230 90, 260 20, 310 10 L310 150 L0 150 Z" fill="rgba(56, 189, 248, 0.12)"/>
    <path d="M0 130 C 60 110, 110 50, 170 70 C 230 90, 260 20, 310 10" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    
    <circle cx="170" cy="70" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
    <circle cx="310" cy="10" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>

    <!-- Highlighting Bento Pill -->
    <rect x="190" y="95" width="115" height="38" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1"/>
    <text x="202" y="112" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#94a3b8">TASA DE ÉXITO</text>
    <text x="202" y="126" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#38bdf8">98.4% SLA</text>
  </g>
</svg>
