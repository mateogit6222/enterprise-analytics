<div
  class="kpi-card"
  [class.interactive]="kpiClick.observed"
  [class.loading]="loading"
  (click)="onClick()"
  [attr.tabindex]="kpiClick.observed ? 0 : null"
  [attr.role]="kpiClick.observed ? 'button' : 'region'"
  [attr.aria-label]="ariaDescription"
  (keydown.enter)="onClick()"
  (keydown.space)="onClick()"
>
  @if (loading) {
    <!-- Estado de carga interno -->
    <div class="kpi-loading-state">
      <div class="loading-top">
        <ion-skeleton-text [animated]="true" style="width: 60%; height: 14px; border-radius: 4px;"></ion-skeleton-text>
      </div>
      <ion-skeleton-text [animated]="true" style="width: 75%; height: 28px; margin: 8px 0; border-radius: 4px;"></ion-skeleton-text>
      <ion-skeleton-text [animated]="true" style="width: 45%; height: 14px; border-radius: 4px;"></ion-skeleton-text>
    </div>
  } @else {
    <!-- Cabecera: Título y meta sutil (Taste-Skill §5: type, not tiles) -->
    <div class="kpi-top">
      <span class="kpi-label">{{ kpi.label }}</span>
      <ion-icon [name]="kpi.icon || 'stats-chart-outline'" class="kpi-meta-icon" aria-hidden="true"></ion-icon>
    </div>

    <!-- Valor Principal en Cifras Tabulares -->
    <div class="kpi-value-row">
      <span class="kpi-value num">
        @if (isCurrency) {
          {{ kpi.value | currencyFormat }}
        } @else {
          {{ kpi.value | number:'1.0-2':'es-ES' }} <small class="kpi-unit">{{ kpi.unit }}</small>
        }
      </span>
    </div>

    <!-- Pie: Indicador de Tendencia con delta honesto -->
    <div class="kpi-footer">
      <span
        class="delta"
        [ngClass]="{
          'trend-up': kpi.trend === KpiTrend.UP,
          'trend-down': kpi.trend === KpiTrend.DOWN,
          'trend-stable': kpi.trend === KpiTrend.STABLE
        }"
      >
        <span class="delta-mark">
          {{ kpi.trend === KpiTrend.UP ? '↑ +' : kpi.trend === KpiTrend.DOWN ? '↓ ' : '— ' }}{{ kpi.changePercent }}%
        </span>
        <span class="comparison-text">vs período anterior</span>
      </span>
    </div>
  }
</div>
