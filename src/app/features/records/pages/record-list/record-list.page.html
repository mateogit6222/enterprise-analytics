<ion-header [translucent]="true" class="ion-no-border header-taste">
  <ion-toolbar class="toolbar-taste">
    <ion-buttons slot="start">
      <ion-menu-button aria-label="Abrir menú de navegación" class="menu-btn-taste"></ion-menu-button>
    </ion-buttons>
    <ion-title class="page-title-taste">Registros Operativos</ion-title>
    <ion-buttons slot="end">
      <button
        type="button"
        class="btn-primary-taste d-flex align-items-center gap-1"
        (click)="openCreateModal()"
        aria-label="Crear nuevo registro empresarial"
      >
        <i class="bi bi-plus-lg" aria-hidden="true"></i>
        <span class="btn-text">Nuevo Registro</span>
      </button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="page-content">
  <main class="container-fluid px-3 px-lg-4 py-3" aria-label="Gestor de registros corporativos">

    <!-- Encabezado de la Sección con Bootstrap 5 Grid y Directrices Taste-Skill -->
    <header class="bento-card p-3 p-md-4 mb-3" aria-label="Cabecera de registros empresariales">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
        <div class="header-titles">
          <div class="d-inline-flex align-items-center gap-2 mb-2">
            <span class="pill pill-neutral d-flex align-items-center gap-1.5">
              <span class="status-dot dot-success"></span>
              <span>Supabase Cloud PostgreSQL</span>
            </span>
          </div>
          <h1 class="screen-title mb-1">Directorio de Operaciones</h1>
          <p class="screen-subtitle mb-0" style="max-width: 680px;">
            Auditoría y administración transaccional sincronizada en tiempo real con respaldo seguro en memoria.
          </p>
        </div>

        <!-- Barra de Acciones Globales de Exportación con Botones Bootstrap 5 Refinados -->
        <div class="d-flex align-items-center gap-2 flex-wrap" aria-label="Acciones de exportación de registros">
          <button
            type="button"
            class="btn btn-sm btn-subtle-taste d-inline-flex align-items-center gap-1.5"
            (click)="exportToPdf()"
            [disabled]="exporting$ | async"
            aria-label="Exportar todos los registros a documento PDF profesional">
            <i class="bi bi-file-earmark-pdf text-muted" aria-hidden="true"></i>
            <span>Exportar PDF</span>
          </button>

          <button
            type="button"
            class="btn btn-sm btn-subtle-taste d-inline-flex align-items-center gap-1.5"
            (click)="exportToCsv()"
            [disabled]="exporting$ | async"
            aria-label="Exportar datos a formato CSV con codificación UTF-8 para Excel">
            <i class="bi bi-file-earmark-spreadsheet text-muted" aria-hidden="true"></i>
            <span>Exportar CSV</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Indicador de sincronización sutil -->
    @if (loading$ | async) {
      <div class="sync-banner d-flex align-items-center gap-2 py-2 px-3 mb-3" role="status">
        <ion-spinner name="crescent" class="sync-spinner"></ion-spinner>
        <span class="sync-text">Sincronizando registros con Supabase PostgreSQL Cloud...</span>
      </div>
    }

    <!-- Componente DataTable Reutilizable en Bento Card -->
    <div class="bento-table-card">
      <app-data-table
        [data]="(records$ | async) ?? []"
        [loading]="(loading$ | async) ?? false"
        [columns]="columns"
        [actions]="actions"
        [pageSize]="10"
        [pageSizeOptions]="[5, 10, 25, 50]"
        (actionTriggered)="onActionTriggered($event)"
        (exportCsv)="exportToCsv()">
      </app-data-table>
    </div>

  </main>
</ion-content>
