<ion-header [translucent]="true" class="ion-no-border header-glass">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button aria-label="Abrir menú de navegación"></ion-menu-button>
    </ion-buttons>
    <ion-title>Gestión Integral de Registros</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openCreateModal()" color="light" class="create-btn" aria-label="Crear nuevo registro">
        <ion-icon slot="start" name="add-circle-outline"></ion-icon>
        <span class="btn-text">Nuevo Registro</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="page-content">
  <div class="content-container">

    <!-- Encabezado de la Sección -->
    <header class="section-header">
      <div class="header-titles">
        <h1 class="page-title">Directorio de Registros Corporativos</h1>
        <p class="page-subtitle">
          Administración y consulta unificada de registros procedentes de bases de datos relacionales (SQL) y NoSQL.
        </p>
      </div>

      <!-- Barra de Acciones Globales de Exportación -->
      <div class="export-actions-bar" aria-label="Acciones de exportación">
        <ion-button
          fill="outline"
          color="danger"
          size="small"
          (click)="exportToPdf()"
          [disabled]="exporting$ | async"
          aria-label="Exportar todos los registros a documento PDF profesional">
          <ion-icon slot="start" name="document-text-outline"></ion-icon>
          Exportar PDF
        </ion-button>

        <ion-button
          fill="outline"
          color="success"
          size="small"
          (click)="exportToCsv()"
          [disabled]="exporting$ | async"
          aria-label="Exportar datos a formato CSV con codificación UTF-8 para Excel">
          <ion-icon slot="start" name="download-outline"></ion-icon>
          Exportar CSV
        </ion-button>
      </div>
    </header>

    <!-- Indicador de carga asíncrona -->
    @if (loading$ | async) {
      <div class="loading-state-bar">
        <ion-spinner name="crescent" color="primary"></ion-spinner>
        <span>Sincronizando registros con API REST y Firestore...</span>
      </div>
    }

    <!-- Componente DataTable Reutilizable (Fase 2) -->
    <div class="table-card">
      <app-data-table
        [data]="(records$ | async) ?? []"
        [loading]="(loading$ | async) ?? false"
        [columns]="columns"
        [actions]="actions"
        [pageSize]="10"
        [pageSizeOptions]="[5, 10, 25, 50]"
        (actionTriggered)="onActionTriggered($event)"
        (exportCsv)="exportToCsv()">
      </app-data-table>
    </div>

  </div>
</ion-content>
